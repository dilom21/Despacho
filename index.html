<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho Vehicular - Cliente</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <header>
    <h1>Despacho Vehicular</h1>
  </header>

  <main class="pagina">
    <div id="map"></div>

    <section class="panel">
      <h2>Solicitar taxi</h2>
      <p class="texto-ayuda">Completa tus datos, marca tu destino y elige un conductor disponible.</p>

      <label for="nombreCliente">Nombre</label>
      <input id="nombreCliente" type="text" placeholder="Ej. Ana">

      <label for="horaDestino">Hora límite de llegada</label>
      <input id="horaDestino" type="time">

      <label for="destinoCliente">Destino</label>
      <input id="destinoCliente" type="text" placeholder="Dirección o lugar">

      <div class="fila-botones">
        <button id="btnBuscarDestino">Buscar</button>
        <button id="btnElegirMapa" class="secundario">Elegir en mapa</button>
      </div>

      <button id="btnUbicacion" class="secundario">Usar mi ubicación actual</button>
      <button id="btnSolicitar">Buscar conductores</button>

      <div id="destinoInfo" class="estado oculto"></div>
      <div id="clienteStatus" class="estado">Todavía no has solicitado un viaje.</div>

      <div id="listaChoferes" class="lista oculto">
        <h3>Conductores disponibles</h3>
        <div id="choferesList"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/cliente.js"></script>
</body>
</html>
