<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho Vehicular - Administrador</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header>
    <h1>Administración de flota</h1>
  </header>

  <section id="loginVista" class="login-wrap">
    <div class="login-box">
      <h2>Ingreso del administrador</h2>
      <p class="texto-ayuda">Esta ruta es solo para monitoreo de la flota y auditorías.</p>

      <label for="emailAdmin">Correo</label>
      <input id="emailAdmin" type="email" placeholder="admin@despacho.com">

      <label for="passAdmin">Contraseña</label>
      <input id="passAdmin" type="password" placeholder="Contraseña">

      <button id="btnLogin">Ingresar</button>
      <div id="loginEstado" class="estado oculto"></div>
    </div>
  </section>

  <main id="appVista" class="pagina contenido-app">
    <div id="map"></div>

    <section class="panel">
      <h2>Monitoreo</h2>
      <p class="texto-ayuda">Los puntos del mapa provienen del GPS de los celulares usados por los conductores.</p>

      <div id="resumen" class="estado">Cargando datos...</div>
      <div id="alertaDesvio" class="estado error oculto"></div>

      <h3>Conductores</h3>
      <div id="conductoresLista"></div>

      <h3>Auditorías recientes</h3>
      <div id="auditoriasLista" class="lista"></div>

      <div class="separador"></div>
      <button id="btnCerrar" class="secundario">Cerrar sesión</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
